include:
  - project: limenet/ci-cd-templates
    ref: master
    file: node/deploy_netlify.yml
  - project: limenet/ci-cd-templates
    ref: master
    file: laravel/sbom.yml

stages:
  - build
  - deploy
  - sbom

variables:
  PHP_VERSION: "8.5"

deploy:
  extends:
    - .deploy_netlify

sbom:npm:
  extends:
    - .sbom_npm
