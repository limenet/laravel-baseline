name: npm-publish

# Publishing is deliberately NOT part of `npm run release`. release-it's order is
# bump -> commit -> tag -> push -> publish, so a failed `npm publish` would leave
# the tag pushed and Packagist already serving a version npm can never receive —
# npm versions are immutable, so that release could not be re-run. Splitting it
# out means a failed publish is just a re-run of this workflow, with no retag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v2.7.0)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Both artifacts are versioned in lockstep, so a mismatch means the bumper
      # wrote one file and not the other. Catch it before npm makes it permanent.
      - name: Assert the tag and both manifests agree
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          node -e '
            const tag = process.env.TAG.replace(/^v/, "");
            const pkg = require("./package.json").version;
            const composer = require("./composer.json").version;
            if (pkg !== tag || composer !== tag) {
              console.error(`version mismatch — tag=${tag} package.json=${pkg} composer.json=${composer}`);
              process.exit(1);
            }
            console.log(`version ${tag} agrees across tag, package.json and composer.json`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Lint, build and test
        run: npm run ci-lint && npm run build && npm test

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
